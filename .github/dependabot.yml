# Dependabot configuration for the malcolm workspace.
#
# Enabling Dependabot satisfies the OpenSSF Scorecard
# "Dependency-Update-Tool" check and keeps the GitHub Actions and Cargo
# dependency trees up to date automatically.

version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Cap concurrent PRs so the auto-merge queue doesn't explode.
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "ci"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "cargo"
    # Major bumps are noisy and often need code changes (see the
    # rand 0.8 -> 0.9 jump that needed source-level fixes). Open
    # them anyway so the maintainer sees the diff, but let a human
    # review the PR before merge.
    groups:
      minor-and-patch:
        applies-to: "version-updates"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Don't bump the rust-version floor automatically — that is a
      # human-curated decision tied to the local toolchain contract.
      - dependency-name: "rust-version"
