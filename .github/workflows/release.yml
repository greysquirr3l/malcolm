name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_run:
    workflows:
      - "Auto Tag"
    types:
      - completed
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g., v1.2.3)"
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.95.0"

jobs:
  resolve-tag:
    name: Resolve release tag and SHA
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      should_release: ${{ steps.tag.outputs.should_release }}
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.tag.outputs.sha }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Determine tag and SHA
        id: tag
        run: |
          set -euo pipefail
          git fetch --tags --force origin

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
            SHA=$(git rev-list -n 1 "$TAG" 2>/dev/null || true)
            if [[ -z "$SHA" ]]; then
              echo "Tag $TAG not found" >&2
              exit 1
            fi
          elif [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            SHA="${{ github.event.workflow_run.head_sha }}"
            TAG=$(git tag --points-at "$SHA" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
            if [[ -z "$TAG" ]]; then
              echo "No semver tag found for workflow_run SHA $SHA; skipping release"
              {
                echo "should_release=false"
                echo "tag="
                echo "sha="
                echo "version="
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            TAG="${GITHUB_REF#refs/tags/}"
            SHA="${GITHUB_SHA}"
          fi

          VERSION="${TAG#v}"
          {
            echo "should_release=true"
            echo "tag=$TAG"
            echo "sha=$SHA"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"

  verify-ci:
    name: Verify CI is green
    runs-on: ubuntu-latest
    needs: [resolve-tag]
    if: ${{ needs.resolve-tag.outputs.should_release == 'true' && needs.resolve-tag.outputs.tag != '' }}
    steps:
      - name: Wait for CI workflow result on tagged commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ needs.resolve-tag.outputs.sha }}
        run: |
          set -euo pipefail

          sha="${RELEASE_SHA}"
          repo="${GITHUB_REPOSITORY}"
          api="https://api.github.com/repos/${repo}/actions/runs?head_sha=${sha}&event=push&per_page=50"

          for attempt in {1..30}; do
            json=$(curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" "${api}")
            ci_status=$(echo "${json}" | jq -r '.workflow_runs[] | select(.name == "CI") | .status' | head -n1)
            ci_conclusion=$(echo "${json}" | jq -r '.workflow_runs[] | select(.name == "CI") | .conclusion' | head -n1)

            if [[ -z "${ci_status}" ]]; then
              sleep 20
              continue
            fi

            if [[ "${ci_status}" != "completed" ]]; then
              sleep 20
              continue
            fi

            if [[ "${ci_conclusion}" == "success" ]]; then
              exit 0
            fi

            echo "CI did not pass for ${sha}: ${ci_conclusion}" >&2
            exit 1
          done

          echo "Timed out waiting for CI completion on ${sha}" >&2
          exit 1

  publish-crates:
    name: Publish crates to crates.io
    runs-on: ubuntu-latest
    needs: [resolve-tag, verify-ci]
    if: ${{ needs.resolve-tag.outputs.should_release == 'true' && needs.resolve-tag.outputs.tag != '' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.resolve-tag.outputs.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Verify versions match release tag
        env:
          RELEASE_VERSION: ${{ needs.resolve-tag.outputs.version }}
        run: |
          set -euo pipefail
          for crate in malcolm-core malcolm malcolm-lens; do
            version=$(cargo metadata --no-deps --format-version 1 | jq -r ".packages[] | select(.name == \"${crate}\") | .version")
            if [[ "${version}" != "${RELEASE_VERSION}" ]]; then
              echo "Version mismatch for ${crate}: ${version} != ${RELEASE_VERSION}" >&2
              exit 1
            fi
          done

      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          RELEASE_VERSION: ${{ needs.resolve-tag.outputs.version }}
        run: |
          set -euo pipefail

          is_published() {
            crate="$1"
            cargo search "$crate" --limit 1 2>/dev/null | grep -q "^${crate} = \"${RELEASE_VERSION}\""
          }

          wait_for_index() {
            crate="$1"
            for _ in {1..18}; do
              if is_published "$crate"; then
                return 0
              fi
              sleep 10
            done
            return 1
          }

          publish_if_missing() {
            crate="$1"
            manifest="$2"

            if is_published "$crate"; then
              echo "${crate}@${RELEASE_VERSION} already published, skipping"
              return 0
            fi

            for attempt in {1..5}; do
              if cargo publish --manifest-path "$manifest" --locked 2>&1 | tee /tmp/publish-${crate}.log; then
                echo "${crate}@${RELEASE_VERSION} publish succeeded"
                wait_for_index "$crate" || true
                return 0
              fi

              if is_published "$crate"; then
                echo "${crate}@${RELEASE_VERSION} already visible on crates.io after failed publish attempt"
                return 0
              fi

              if rg -qi "already exists|already uploaded|already been uploaded" /tmp/publish-${crate}.log; then
                echo "${crate}@${RELEASE_VERSION} appears already published"
                wait_for_index "$crate" || true
                return 0
              fi

              echo "Publish attempt ${attempt}/5 for ${crate} failed"
              if [[ "${attempt}" -lt 5 ]]; then
                sleep $((attempt * 15))
              fi
            done

            echo "Failed to publish ${crate} after retries" >&2
            return 1
          }

          publish_if_missing "malcolm-core" "crates/malcolm-core/Cargo.toml"
          publish_if_missing "malcolm" "crates/malcolm/Cargo.toml"
          publish_if_missing "malcolm-lens" "crates/malcolm-lens/Cargo.toml"

  github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [resolve-tag, publish-crates]
    if: ${{ needs.resolve-tag.outputs.should_release == 'true' && needs.resolve-tag.outputs.tag != '' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.resolve-tag.outputs.sha }}

      - name: Create release notes body
        id: notes
        env:
          VERSION: ${{ needs.resolve-tag.outputs.version }}
        run: |
          {
            echo "notes<<EOF"
            echo "Published crates for ${VERSION}:"
            echo "- malcolm-core"
            echo "- malcolm"
            echo "- malcolm-lens"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ needs.resolve-tag.outputs.tag }}
          target_commitish: ${{ needs.resolve-tag.outputs.sha }}
          name: Malcolm ${{ needs.resolve-tag.outputs.tag }}
          draft: false
          prerelease: ${{ contains(needs.resolve-tag.outputs.tag, '-') }}
          generate_release_notes: true
          body: ${{ steps.notes.outputs.notes }}
