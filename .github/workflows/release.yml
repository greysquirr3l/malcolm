name: Release

# Fires from three sources:
#   1. A tag pushed manually (push: tags) — works for human-pushed tags.
#   2. The auto-tag workflow dispatching the release after it pushes a
#      GITHUB_TOKEN-created tag (workflow_run). GITHUB_TOKEN-pushed tags
#      do not retrigger workflow runs, hence the explicit dispatch.
#   3. Manual workflow_dispatch for re-runs or back-fills.
on:
  push:
    tags:
      - "v*"
  workflow_run:
    workflows: ["Auto Tag"]
    types: [requested]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.3.0)"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

# Top-level permissions are read-only; jobs that need write access
# (e.g. publish-crates) declare their own grants.
permissions:
  contents: read

# One release in flight per tag so a concurrent re-run does not
# double-publish.
concurrency:
  group: release-${{ github.event.inputs.tag || github.event.workflow_run.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve-tag:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine tag
        id: tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            # Auto-tag pushed the tag and dispatched this workflow. The
            # tag does not appear on workflow_run.inputs because
            # gh workflow run does not propagate string inputs reliably.
            # We pull the most recent v* tag pushed in the last 5
            # minutes instead.
            TAG=$(git for-each-ref --sort=-creatordate --format '%(refname:short)' refs/tags/v* | head -n1)
            if [[ -z "$TAG" ]]; then
              echo "No v* tag found; nothing to release"
              echo "tag="     >> "$GITHUB_OUTPUT"
              echo "version=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            # push: tags trigger
            TAG="${{ github.ref_name }}"
          fi

          VERSION="${TAG#v}"
          echo "tag=$TAG"     >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved: tag=$TAG version=$VERSION"

  verify-ci:
    name: Verify CI is green
    runs-on: ubuntu-latest
    if: needs.resolve-tag.outputs.tag != ''
    needs: [resolve-tag]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Match any CI run on the branch, not just `event=push`. This
      # covers squash-merge commits that have no `event=push` run.
      - name: Wait for CI workflow result on tagged commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: |
          set -euo pipefail

          sha=$(git rev-list -n1 "${RELEASE_TAG}")
          repo="${GITHUB_REPOSITORY}"
          api="https://api.github.com/repos/${repo}/actions/runs?head_sha=${sha}&per_page=50"

          echo "Checking CI status for ${repo}@${sha}"

          for attempt in {1..30}; do
            json=$(curl -fsSL \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${api}")

            ci_status=$(echo "${json}" | jq -r '.workflow_runs[] | select(.name == "CI") | .status' | head -n1)
            ci_conclusion=$(echo "${json}" | jq -r '.workflow_runs[] | select(.name == "CI") | .conclusion' | head -n1)

            if [[ -z "${ci_status}" ]]; then
              echo "Attempt ${attempt}/30: CI workflow run not found yet; waiting..."
              sleep 20
              continue
            fi

            if [[ "${ci_status}" != "completed" ]]; then
              echo "Attempt ${attempt}/30: CI is ${ci_status}; waiting..."
              sleep 20
              continue
            fi

            if [[ "${ci_conclusion}" == "success" ]]; then
              echo "CI completed successfully for ${sha}"
              exit 0
            fi

            echo "CI did not pass for ${sha}: conclusion=${ci_conclusion}"
            exit 1
          done

          echo "Timed out waiting for CI completion on ${sha}"
          exit 1

  publish-crates:
    name: Publish crates to crates.io
    runs-on: ubuntu-latest
    if: needs.resolve-tag.outputs.tag != ''
    needs: [resolve-tag, verify-ci]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}
          persist-credentials: false

      - name: Verify versions match the tag
        env:
          RELEASE_VERSION: ${{ needs.resolve-tag.outputs.version }}
        run: |
          set -euo pipefail
          for crate in malcolm-core malcolm malcolm-lens; do
            version=$(cargo metadata --no-deps --format-version 1 | jq -r ".packages[] | select(.name == \"${crate}\") | .version")
            if [[ "${version}" != "${RELEASE_VERSION}" ]]; then
              echo "Version mismatch for ${crate}: ${version} != ${RELEASE_VERSION}" >&2
              exit 1
            fi
          done

      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          RELEASE_VERSION: ${{ needs.resolve-tag.outputs.version }}
        run: |
          set -euo pipefail

          is_published() {
            crate="$1"
            cargo search "$crate" --limit 1 2>/dev/null | grep -q "^${crate} = \"${RELEASE_VERSION}\""
          }

          wait_for_index() {
            crate="$1"
            for _ in {1..18}; do
              if is_published "$crate"; then
                return 0
              fi
              sleep 10
            done
            return 1
          }

          publish_if_missing() {
            crate="$1"
            manifest="$2"

            if is_published "$crate"; then
              echo "${crate}@${RELEASE_VERSION} already published, skipping"
              return 0
            fi

            for attempt in {1..5}; do
              if cargo publish --manifest-path "$manifest" --locked 2>&1 | tee /tmp/publish-${crate}.log; then
                echo "${crate}@${RELEASE_VERSION} publish succeeded"
                wait_for_index "$crate" || true
                return 0
              fi

              if is_published "$crate"; then
                echo "${crate}@${RELEASE_VERSION} already visible on crates.io after failed publish attempt"
                return 0
              fi

              if rg -qi "already exists|already uploaded|already been uploaded" /tmp/publish-${crate}.log; then
                echo "${crate}@${RELEASE_VERSION} appears already published"
                wait_for_index "$crate" || true
                return 0
              fi

              echo "Publish attempt ${attempt}/5 for ${crate} failed"
              if [[ "${attempt}" -lt 5 ]]; then
                sleep $((attempt * 15))
              fi
            done

            echo "Failed to publish ${crate} after retries" >&2
            return 1
          }

          publish_if_missing "malcolm-core" "crates/malcolm-core/Cargo.toml"
          publish_if_missing "malcolm" "crates/malcolm/Cargo.toml"
          publish_if_missing "malcolm-lens" "crates/malcolm-lens/Cargo.toml"

  github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    if: needs.resolve-tag.outputs.tag != ''
    needs: [resolve-tag, publish-crates]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}
        env:
          RELEASE_VERSION: ${{ needs.resolve-tag.outputs.version }}
        run: |
          {
            echo "notes<<EOF"
            echo "Published crates for ${RELEASE_VERSION}:"
            echo "- malcolm-core"
            echo "- malcolm"
            echo "- malcolm-lens"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ needs.resolve-tag.outputs.tag }}
          name: Malcolm ${{ needs.resolve-tag.outputs.tag }}
          draft: false
          prerelease: ${{ contains(needs.resolve-tag.outputs.version, '-alpha') || contains(needs.resolve-tag.outputs.version, '-beta') || contains(needs.resolve-tag.outputs.version, '-rc') }}
          generate_release_notes: true
          body: ${{ steps.notes.outputs.notes }}
