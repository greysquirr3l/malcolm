name: Security Audit

# Path-filtered so we only re-run the supply-chain gate when deps or
# this workflow file change. Scheduling is nightly and on demand.
# This workflow is intentionally separate from `ci.yml` so a flaky
# `cargo deny` advisory database update cannot block the main CI
# pipeline or, by extension, the release pipeline.

on:
  push:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/security.yml"
      - ".github/dependabot.yml"
      - "deny.toml"
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/security.yml"
      - ".github/dependabot.yml"
      - "deny.toml"
  schedule:
    # Weekly off-hours sweep to catch new advisories that landed
    # without a manifest change.
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# One in-flight audit per branch. Cancels redundant PR pushes against
# the same branch.
concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-audit:
    name: cargo audit (RustSec advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      # `taiki-e/install-action` chokes on newer cargo-audit manifests;
      # a direct `cargo install --locked` is portable and reproducible.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit

  cargo-deny:
    name: cargo deny (licenses, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      # Pinned to 0.19.9: 0.16.3 can't parse CVSS 4.0 scoring in the
      # current RustSec advisory database, and older versions choke on
      # the Unicode-3.0 SPDX identifier used by webpki-root-certs.
      # `taiki-e/install-action` can't parse the 0.19.x manifest, so
      # we install via cargo.
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.19.9

      - name: Run cargo deny
        run: cargo deny check
