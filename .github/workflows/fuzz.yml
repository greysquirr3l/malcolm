name: Fuzz

# Best-effort weekly cargo-fuzz run. Crashes are uploaded as
# artifacts for manual triage; the run is non-blocking (`continue-
# on-error: true`) so a single crash does not red-light the
# workflow.

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

# One fuzz run at a time; new schedule runs cancel any in-flight
# run from the previous week.
concurrency:
  group: fuzz-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: cargo-fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - classify
          - envelope_from_bytes
          - response_parser
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Run ${{ matrix.target }} for 60s
        continue-on-error: true
        run: |
          cargo fuzz run ${{ matrix.target }} -- -max_total_time=60

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-${{ matrix.target }}-crashes
          path: fuzz/artifacts/${{ matrix.target }}/
          retention-days: 7
