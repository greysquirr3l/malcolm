name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/book/**"
      - "docs/**"
      - "crates/**"
      - ".github/workflows/wiki.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build mdBook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install mdBook
        uses: taiki-e/install-action@05829426d56c23290286f25dac53f536b618027b # v2.4.0
        with:
          # Pinned version. `latest` is risky — a new mdBook release
          # can change the build's expected syntax.
          tool: mdbook@0.4.43

      - name: Build book
        run: mdbook build docs/book

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: book

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
