name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-test:
    name: Build, test, and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Ensure rustfmt and clippy are available
        run: rustup component add rustfmt clippy

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build workspace
        run: cargo build --workspace --all-targets

      - name: Build examples
        run: cargo build --workspace --examples

      - name: Build with lens providers
        run: |
          cargo build -p malcolm-lens --features ollama
          cargo build -p malcolm-lens --no-default-features --features anthropic

      - name: Run tests
        run: cargo test --workspace

      - name: Run doctests
        run: cargo test --workspace --doc

      - name: Build docs
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

  docs-book:
    name: Build mdBook docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install mdBook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook

      - name: Build handbook
        run: mdbook build docs/book

  no-std-check:
    name: Verify malcolm-core is no_std compatible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install stable toolchain with no_std target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7m-none-eabi

      - name: Ensure no_std target is available
        run: rustup target add thumbv7m-none-eabi

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Build malcolm-core without std
        run: cargo build -p malcolm-core --target thumbv7m-none-eabi --no-default-features

  supply-chain:
    name: Supply-chain audit (deny + audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Run cargo-deny
        run: cargo deny check

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run cargo-audit
        run: cargo audit

  markdownlint:
    name: Lint markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run markdownlint
        run: |
          if command -v markdownlint-cli2 >/dev/null 2>&1; then
            markdownlint-cli2 "**/*.md" "#book/**/*.html"
          else
            echo "markdownlint-cli2 not installed; skipping"
          fi
