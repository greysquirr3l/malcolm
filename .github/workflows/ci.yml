name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-test:
    name: Build, test, and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Ensure rustfmt and clippy are available
        run: rustup component add rustfmt clippy

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Build workspace
        run: cargo build --workspace

      - name: Run tests
        run: cargo test --workspace

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace -- -D warnings

  docs-book:
    name: Build mdBook docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install mdBook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook

      - name: Build handbook
        run: mdbook build docs/book

  no-std-check:
    name: Verify malcolm-core is no_std compatible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain with no_std target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7m-none-eabi

      - name: Ensure no_std target is available
        run: rustup target add thumbv7m-none-eabi

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Build malcolm-core without std
        run: cargo build -p malcolm-core --target thumbv7m-none-eabi --no-default-features
