name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Default to read-only; each job declares its own minimum. This is
# the OpenSSF-recommended pattern: top-level write grants trigger a
# Token-Permissions finding.
permissions:
  contents: read

# One CI in flight per branch. Cancels redundant runs against the
# same branch when new pushes arrive.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, test, and lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@5cb072d7354962be830356aa6b146f7612846014 # v2.7.5

      - name: Build workspace
        run: cargo build --workspace --all-targets

      - name: Build examples
        run: cargo build --workspace --examples

      - name: Build with lens providers
        run: |
          cargo build -p malcolm-lens --features ollama
          cargo build -p malcolm-lens --no-default-features --features anthropic

      - name: Run tests
        run: cargo test --workspace

      - name: Run doctests
        run: cargo test --workspace --doc

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

  format-check:
    name: Format check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      # Read the pinned version from rust-toolchain.toml so the
      # component-add below targets the exact toolchain the project
      # uses (1.96.0 in rust-toolchain.toml overrides `stable`).
      - name: Resolve toolchain version
        id: toolchain
        run: |
          set -euo pipefail
          version=$(awk -F'"' '/^\[toolchain\]/{flag=1; next} flag && /channel =/{gsub(/ /,""); print $2; exit}' rust-toolchain.toml)
          if [ -z "$version" ]; then version="stable"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "resolved toolchain: $version"

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}

      # The dtolnay action with --profile minimal (default) reports
      # components as installed but `cargo fmt` then errors with
      # "cargo-fmt is not installed for the toolchain …" (rustup
      # recursion bug). Adding the component explicitly here is
      # idempotent and resolves the issue.
      - name: Ensure rustfmt is present
        run: rustup component add rustfmt --toolchain ${{ steps.toolchain.outputs.version }}

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@5cb072d7354962be830356aa6b146f7612846014 # v2.7.5

      - name: Check formatting
        run: cargo fmt --all -- --check

  docs-book:
    name: Build mdBook docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install mdBook
        uses: taiki-e/install-action@05829426d56c23290286f25dac53f536b618027b # v2.4.0
        with:
          tool: mdbook@0.4.43

      - name: Build handbook
        run: mdbook build docs/book

  no-std-check:
    name: Verify malcolm-core is no_std compatible
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install stable toolchain with no_std target
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: thumbv7m-none-eabi

      - name: Install no_std target
        run: rustup target add thumbv7m-none-eabi

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@5cb072d7354962be830356aa6b146f7612846014 # v2.7.5

      - name: Build malcolm-core without std
        run: cargo build -p malcolm-core --target thumbv7m-none-eabi --no-default-features

  build-docs:
    name: Cargo API docs (RUSTDOCFLAGS=-D warnings)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@5cb072d7354962be830356aa6b146f7612846014 # v2.7.5

      - name: Build rustdoc with -D warnings
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps

  markdownlint:
    name: Lint markdown
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install markdownlint-cli2
        run: |
          if ! command -v markdownlint-cli2 >/dev/null 2>&1; then
            npm install -g markdownlint-cli2
          fi

      # Pass the config explicitly because CI shells may not pick
      # up .markdownlint.json from the project root depending on the
      # installed markdownlint-cli2 version.
      - name: Run markdownlint
        run: markdownlint-cli2 "**/*.md" "#book/**/*.html" "#node_modules/**/*.md"
