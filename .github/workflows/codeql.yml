name: CodeQL

# GitHub-native static analysis. Satisfies the OpenSSF Scorecard
# "SAST" check and surfaces language-specific findings directly in
# the security tab.

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    # Weekly off-hours scan to catch findings on slow-moving branches.
    - cron: "23 4 * * 1"

# Default to no permissions; each job declares its own minimum.
# This avoids the OpenSSF Token-Permissions finding from a top-level
# write grant.
permissions: {}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ["rust"]
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff0a06e83cb2de871e5a09832bc6a81e7276941f # v3.28.18

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@ff0a06e83cb2de871e5a09832bc6a81e7276941f # v3.28.18
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
