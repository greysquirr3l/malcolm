name: CodeQL

# GitHub-native static analysis. Satisfies the OpenSSF Scorecard
# "SAST" check and surfaces language-specific findings in the
# security tab.

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "30 2 * * 0"

# Default to no permissions; the analyze job declares its own minimum
# (this is the OpenSSF Token-Permissions pattern).
permissions: {}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ["rust"]
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          category: "/language:${{ matrix.language }}"
          languages: ${{ matrix.language }}
          queries: security-and-quality
