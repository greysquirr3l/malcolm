name: Auto-tag on release merge

# Triggered by the CI workflow completing successfully on the main
# branch. The release workflow is dispatched explicitly below because
# GITHUB_TOKEN-created tags do not retrigger workflows.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

# One auto-tag run per release commit. cancel-in-progress=false so a
# slow run does not get reaped by a re-trigger.
concurrency:
  group: auto-tag-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  tag:
    name: Push version tag if missing
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Check out main rather than the workflow_run head_sha: a
      # workflow_run event carries the SHA that triggered the upstream
      # workflow, but we already gate on head_branch == 'main', so main's
      # HEAD is the merge commit and the tag/commit we operate on.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Gate on release commit
        id: gate
        run: |
          msg="$(git log -1 --pretty=%s)"
          if [[ "$msg" == chore\(release\):* ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read workspace version
        if: steps.gate.outputs.run == 'true'
        id: version
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "malcolm") | .version')
          if [[ -z "$VERSION" ]]; then
            echo "Could not determine version for crate malcolm" >&2
            exit 1
          fi
          TAG="v${VERSION}"
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Check if tag exists
        if: steps.gate.outputs.run == 'true'
        id: check-tag
        run: |
          if git ls-remote --tags origin "refs/tags/${{ steps.version.outputs.tag }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push tag
        if: steps.gate.outputs.run == 'true' && steps.check-tag.outputs.exists == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.version }}"
          if git push origin "${{ steps.version.outputs.tag }}"; then
            echo "Pushed ${{ steps.version.outputs.tag }}"
            exit 0
          fi
          # Manual push raced us; treat as success.
          if git ls-remote --tags origin "refs/tags/${{ steps.version.outputs.tag }}" | grep -q .; then
            echo "Tag ${{ steps.version.outputs.tag }} was created concurrently; continuing"
            exit 0
          fi
          echo "Failed to push tag ${{ steps.version.outputs.tag }}" >&2
          exit 1

      # GITHUB_TOKEN-pushed tags do not retrigger workflow runs, so
      # dispatch the release workflow explicitly.
      - name: Trigger release workflow
        if: steps.gate.outputs.run == 'true' && steps.check-tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run release.yml \
            --ref "${{ steps.version.outputs.tag }}" \
            -f tag="${{ steps.version.outputs.tag }}"

      - name: Tag already exists
        if: steps.gate.outputs.run == 'true' && steps.check-tag.outputs.exists == 'true'
        run: echo "Tag ${{ steps.version.outputs.tag }} already exists; skipping"

      - name: Not a release commit
        if: steps.gate.outputs.run != 'true'
        run: echo "Skipping auto-tag; head commit is not a release commit"
