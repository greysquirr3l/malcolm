[package]
name = "malcolm-core"
version = "0.6.0"
edition = "2024"
rust-version = "1.85"
description = "Pure math domain primitives for malcolm chaos engineering"
license = "MIT OR Apache-2.0"
repository = "https://github.com/greysquirr3l/malcom"
readme = "../../README.md"
keywords = ["chaos", "fault-injection", "testing", "no-std", "simulation"]
categories = ["no-std", "algorithms", "development-tools::testing"]

[lints]
workspace = true

[dependencies]
libm = "0.2"
rand = { version = "0.10", default-features = false }

[features]
default = []

[dev-dependencies]
proptest = { workspace = true }
criterion = { version = "0.8", default-features = false, features = ["html_reports"] }

[[bench]]
name = "hawkes"
harness = false
