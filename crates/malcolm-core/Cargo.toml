[package]
name = "malcolm-core"
version = "0.1.0"
edition = "2024"
description = "Pure math domain primitives for malcolm chaos engineering"
license = "MIT OR Apache-2.0"
repository = "https://github.com/greysquirr3l/malcom"
readme = "../../README.md"
keywords = ["chaos", "fault-injection", "testing", "no-std", "simulation"]
categories = ["no-std", "algorithms", "development-tools::testing"]

[dependencies]
libm = "0.2"
rand = { version = "0.8", default-features = false, features = ["small_rng"] }

[features]
default = []

