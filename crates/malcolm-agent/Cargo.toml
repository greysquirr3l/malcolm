[package]
name = "malcolm-agent"
version = "0.6.0"
edition = "2024"
rust-version = "1.85"
description = "Optional out-of-process fault adapters for malcolm — real OS side effects behind a SafetyGuard"
license = "MIT OR Apache-2.0"
repository = "https://github.com/greysquirr3l/malcom"
readme = "README.md"
keywords = ["chaos", "fault-injection", "process-control", "cgroups", "netem"]
categories = ["development-tools::testing", "os::unix-apis", "simulation"]

# Per the T33 spec, real OS adapters (T34–T38) may transitively
# depend on crates that wrap syscalls via `unsafe` (e.g. `nix`,
# `caps`, `cgroups-rs`, `rtnetlink`). This crate therefore overrides
# the workspace `unsafe_code = "forbid"` to `unsafe_code = "deny"`
# rather than introducing a separate `forbid` per adapter module.
# The deviation is documented in `README.md` and every direct
# `unsafe` block in this crate (none at the moment — the scaffold
# uses `signal-hook` for safe signal handling) MUST carry a
# `// SAFETY:` justification.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[dependencies]
malcolm = { path = "../malcolm", version = "0.6.0" }
malcolm-core = { path = "../malcolm-core", version = "0.6.0" }
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = "1"
signal-hook = "0.4"
# Real-world adapters are optional. `nix` is the safe-Rust wrapper
# over the `kill(2)`, `wait(2)`, `ptrace(2)`, and signal syscalls
# the process and syscall adapters need. The feature set below is
# the union of what the `process` and `syscall` adapters use; the
# dependency is gated behind either feature, so the default
# build of `malcolm-agent` is the in-process port only.
nix = { version = "0.29", features = ["signal", "process", "ptrace"], optional = true }
# T37's probability-driven fault injection needs a seeded RNG so a fixed
# seed reproduces the same inject/skip sequence across runs. Pinned to
# "0.10" (not the workspace's "0.9") to match `malcolm` and
# `malcolm-core`, which malcolm-agent already depends on directly —
# avoids pulling two incompatible rand majors into one dependency graph.
rand = { version = "0.10", optional = true }

[dev-dependencies]
proptest = { workspace = true }

# Per T33 spec: every real adapter is additionally feature-gated and off by
# default. The default feature set has zero OS side effects; only the in-process
# port + SafetyGuard + NullAdapter are compiled.
[features]
default = []
# T34 — process control (kill, signal, pause/resume) via the `nix` crate
process = ["dep:nix"]
# The `process` and `syscall` features share the same `nix`
# dep. Both features must be able to coexist so `process` and
# `syscall` together don't pull `nix` twice. Unifying them under
# a single optional dep avoids the duplicate-feature conflict
# cargo would otherwise emit.
# T35 — cgroup v2 resource limits (cpu.max / memory.max / io.max). No
# new dependency; the adapter writes the cgroup interface files
# directly via `std::fs` to keep the dependency surface flat.
cgroups = []
# T36 — Linux tc/netem real network fault adapter. No new
# dependency; the adapter shells out to the `tc` binary from
# iproute2, which is part of the host OS. Documented in the
# adapter's README section.
netem = []
# T37 — syscall interception via ptrace (preferred spawn-under-
# supervision) and seccomp user-notification (documented follow-up in
# the adapter's module docs and README — see "Seccomp-unotify
# follow-up" in adapters/syscall/ptrace.rs). Ptrace backend needs nix's
# `ptrace` and `process` features; `rand` drives the seeded,
# reproducible probability sampling for partial-injection plans.
syscall = ["dep:nix", "dep:rand"]
# T38
kubernetes = []
