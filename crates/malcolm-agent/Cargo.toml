[package]
name = "malcolm-agent"
version = "0.7.0"
edition = "2024"
rust-version = "1.85"
description = "Optional out-of-process fault adapters for malcolm — real OS side effects behind a SafetyGuard"
license = "MIT OR Apache-2.0"
repository = "https://github.com/greysquirr3l/malcom"
readme = "README.md"
keywords = ["chaos", "fault-injection", "process-control", "cgroups", "netem"]
categories = ["development-tools::testing", "os::unix-apis", "simulation"]

# Per the T33 spec, real OS adapters (T34–T38) may transitively
# depend on crates that wrap syscalls via `unsafe` (e.g. `nix`,
# `caps`, `cgroups-rs`, `rtnetlink`). This crate therefore overrides
# the workspace `unsafe_code = "forbid"` to `unsafe_code = "deny"`
# rather than introducing a separate `forbid` per adapter module.
# The deviation is documented in `README.md` and every direct
# `unsafe` block in this crate (none at the moment — the scaffold
# uses `signal-hook` for safe signal handling) MUST carry a
# `// SAFETY:` justification.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[dependencies]
malcolm = { path = "../malcolm", version = "0.7.0" }
malcolm-core = { path = "../malcolm-core", version = "0.7.0" }
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = "1"
signal-hook = "0.4"
# Real-world adapters are optional. `nix` is the safe-Rust wrapper
# over the `kill(2)`, `wait(2)`, `ptrace(2)`, and signal syscalls
# the process and syscall adapters need. The feature set below is
# the union of what the `process` and `syscall` adapters use; the
# dependency is gated behind either feature, so the default
# build of `malcolm-agent` is the in-process port only.
nix = { version = "0.31", features = ["signal", "process", "ptrace"], optional = true }
# T37's probability-driven fault injection needs a seeded RNG so a fixed
# seed reproduces the same inject/skip sequence across runs. Pinned to
# "0.10" (not the workspace's "0.9") to match `malcolm` and
# `malcolm-core`, which malcolm-agent already depends on directly —
# avoids pulling two incompatible rand majors into one dependency graph.
rand = { version = "0.10", optional = true }
# T38 — Docker adapter uses `bollard` (pure-Rust Docker daemon client).
# Pinned to the latest 0.x line; bollard is a single-crate dependency
# surface (no transitive gRPC stack) and works against the local Unix
# socket out of the box, respecting `$DOCKER_HOST` for remote daemons.
# `bollard` is async; we run its futures through a dedicated
# `tokio::runtime::Runtime` so the `TargetAdapter` trait can stay
# sync (the rest of the crate is sync — adding `async` to the trait
# would ripple through `Cleanup`, the test harness, and the
# evaluator). Tokio's `rt` + `macros` features are sufficient; we do
# not enable `time` (no sleeps in the adapter itself).
bollard = { version = "0.18", optional = true, default-features = false }
tokio = { workspace = true, optional = true, features = ["rt", "macros"] }
# T38 — Kubernetes adapter: skeleton-only on the dev branch.
# The adapter defines a `KubeClient` trait (see
# `crates/malcolm-agent/src/adapters/kubernetes.rs`) and the safety /
# allowlist / blast-radius / dry-run logic is wired against that
# trait. The real `kube::Client`-backed implementation is a tracked
# follow-up (see the "K8s real client" note in
# `adapters/kubernetes.rs` and the Accumulated Learnings entry) — a
# real K8s cluster is required for full runtime verification, and
# pulling the `kube` + `k8s-openapi` + `tonic` gRPC stack into the
# default feature set is not worth the dependency weight for a
# skeleton. The trait design means the mutation methods are mockable
# today and swappable for a real client later without touching the
# safety / dry-run / blast-radius logic.
# (No optional dep declared for the skeleton — the trait surface is
# all the adapter needs.)

[dev-dependencies]
proptest = { workspace = true }

# Per T33 spec: every real adapter is additionally feature-gated and off by
# default. The default feature set has zero OS side effects; only the in-process
# port + SafetyGuard + NullAdapter are compiled.
[features]
default = []
# T34 — process control (kill, signal, pause/resume) via the `nix` crate
process = ["dep:nix"]
# The `process` and `syscall` features share the same `nix`
# dep. Both features must be able to coexist so `process` and
# `syscall` together don't pull `nix` twice. Unifying them under
# a single optional dep avoids the duplicate-feature conflict
# cargo would otherwise emit.
# T35 — cgroup v2 resource limits (cpu.max / memory.max / io.max). No
# new dependency; the adapter writes the cgroup interface files
# directly via `std::fs` to keep the dependency surface flat.
cgroups = []
# T36 — Linux tc/netem real network fault adapter. No new
# dependency; the adapter shells out to the `tc` binary from
# iproute2, which is part of the host OS. Documented in the
# adapter's README section.
netem = []
# T37 — syscall interception via ptrace (preferred spawn-under-
# supervision) and seccomp user-notification (documented follow-up in
# the adapter's module docs and README — see "Seccomp-unotify
# follow-up" in adapters/syscall/ptrace.rs). Ptrace backend needs nix's
# `ptrace` and `process` features; `rand` drives the seeded,
# reproducible probability sampling for partial-injection plans.
syscall = ["dep:nix", "dep:rand"]
# T38 — Docker adapter: container pause/unpause/kill/stop/restart via
# `bollard`, plus in-container routing of the T35 cgroup / T36 netem
# adapters when those features are also enabled (gated at the call
# site). The `bollard` dep is the only new requirement; the runtime
# surface is a single optional crate to keep the default build lean.
docker = ["dep:bollard", "dep:tokio"]
# T38 — Kubernetes adapter: pod delete/evict and label-selector
# fan-out via `kube`, with the runtime feature (which includes
# tokio by default; the adapter uses `kube::Client::try_default`
# for ambient kubeconfig / in-cluster config). `k8s-openapi`
# types are pulled in lazily when the mutation path is implemented
# — for the skeleton we only need the trait surface and string-
# based resource identification. Skeleton-only on the dev branch:
# the trait, allowlist, blast-radius cap, and dry-run listing are
# wired up, but actual mutations are stubbed behind `not yet
# implemented` returns — a real K8s cluster is required for full
# runtime verification, mirroring the T37 Docker Desktop
# emulation note in the Accumulated Learnings.
kubernetes = []
