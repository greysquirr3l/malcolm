[package]
name = "malcolm"
version = "0.6.0"
edition = "2024"
rust-version = "1.85"
description = "Chaos engineering fault injection library"
license = "MIT OR Apache-2.0"
repository = "https://github.com/greysquirr3l/malcom"
readme = "../../README.md"
keywords = ["chaos", "fault-injection", "distributed-systems", "testing", "simulation"]
categories = ["development-tools::testing", "algorithms", "simulation"]

[lints]
workspace = true

[dependencies]
malcolm-core = { path = "../malcolm-core", version = "0.6.0" }
tracing = { version = "0.1", default-features = false, features = ["std"] }
thiserror = "2"
rand = { version = "0.10" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }
chacha20poly1305 = "0.11"
argon2 = "0.5"

[dependencies.tokio]
version = "1"
optional = true
features = ["time", "rt"]

[dependencies.prometheus]
version = "0.13"
default-features = false
optional = true

[dependencies.opentelemetry]
version = "0.32"
default-features = false
features = ["metrics", "trace"]
optional = true

[dependencies.opentelemetry_sdk]
version = "0.32"
default-features = false
features = ["metrics", "trace", "rt-tokio", "testing"]
optional = true

[dependencies.opentelemetry-otlp]
version = "0.32"
default-features = false
features = ["metrics", "trace", "grpc-tonic", "http-proto", "reqwest-client", "reqwest-rustls"]
optional = true

[dependencies.tracing-opentelemetry]
version = "0.33"
default-features = false
optional = true

[dev-dependencies]
tracing-test = "0.2"
proptest = { workspace = true }
criterion = { version = "0.8", features = ["html_reports"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }

[features]
default = []
tokio = ["dep:tokio"]
prometheus = ["dep:prometheus"]
otel = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:tracing-opentelemetry", "otel-grpc"]
otel-grpc = ["dep:opentelemetry-otlp", "opentelemetry-otlp/grpc-tonic"]
otel-http = ["dep:opentelemetry-otlp", "opentelemetry-otlp/http-proto"]

[[bench]]
name = "core_math"
harness = false

[[bench]]
name = "envelope"
harness = false
