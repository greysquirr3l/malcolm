[package]
name = "malcolm"
version = "0.1.0"
edition = "2024"
description = "Chaos engineering fault injection library"
license = "MIT OR Apache-2.0"

[dependencies]
malcolm-core = { path = "../malcolm-core" }
tracing = "0.1"
thiserror = "2"
rand = "0.8"

[dependencies.tokio]
version = "1"
optional = true
features = ["time", "rt"]

[features]
default = []
tokio = ["dep:tokio"]
