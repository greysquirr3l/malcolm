[package]
name = "malcolm-lens"
version = "0.7.0"
edition = "2024"
rust-version = "1.85"
description = "LLM interpretability layer for malcolm chaos reports"
license = "MIT OR Apache-2.0"
repository = "https://github.com/greysquirr3l/malcom"
readme = "../../README.md"
keywords = ["chaos", "llm", "fault-injection", "testing", "ai"]
categories = ["development-tools::testing", "simulation", "science"]

[lints]
workspace = true

[dependencies]
malcolm = { path = "../malcolm", version = "0.7.0" }
thiserror = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
serde_json = "1"
async-trait = "0.1"
rig-core = "0.41"

[dev-dependencies]
proptest = { workspace = true }

[features]
default = ["ollama"]
ollama = []
anthropic = []
