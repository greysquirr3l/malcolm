[graph]
targets = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    # Community Data License Agreement Permissive 2.0 — used by the
    # `webpki-root-certs` Mozilla CA bundle, pulled in transitively via
    # `rustls-platform-verifier` -> `reqwest` -> `rig-core` -> `malcolm-lens`.
    # This is a permissive Linux-Foundation data license and is safe for our
    # distribution.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"

[advisories]
ignore = []
