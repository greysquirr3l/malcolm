[graph]
targets = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    # Community Data License Agreement Permissive 2.0 — used by the
    # `webpki-root-certs` Mozilla CA bundle, pulled in transitively via
    # `rustls-platform-verifier` -> `reqwest` -> `rig-core` -> `malcolm-lens`.
    # This is a permissive Linux-Foundation data license and is safe for our
    # distribution.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"

[advisories]
# Kept in sync with `.cargo/audit.toml` so the `cargo audit` and
# `cargo deny` gates agree on the same advisory set. The reasoning for
# each entry lives in `.cargo/audit.toml`.
#
# - RUSTSEC-2026-0367/0368/0369 (zip): symlink and permission handling
#   in the archive *extraction* path. `zip` reaches us only through the
#   optional `bayesopt` feature, and `ndarray-npy` reads `.npz` payloads
#   in memory via `by_index` / `by_name` rather than `extract()`, so the
#   vulnerable code is unreachable. The fix ships in `zip >= 9.0.0` and
#   `ndarray-npy` pins `zip ^2` with no compatible release in between.
# - RUSTSEC-2025-0141 (bincode): unmaintained, no patched release.
#   Reached only through the optional `bayesopt` feature.
# - RUSTSEC-2024-0436 (paste): unmaintained build-time proc-macro
#   helper, no patched release.
ignore = [
    { id = "RUSTSEC-2026-0367", reason = "zip extraction path is unreachable; only present under the optional bayesopt feature" },
    { id = "RUSTSEC-2026-0368", reason = "zip extraction path is unreachable; only present under the optional bayesopt feature" },
    { id = "RUSTSEC-2026-0369", reason = "zip extraction path is unreachable; only present under the optional bayesopt feature" },
    { id = "RUSTSEC-2025-0141", reason = "bincode is unmaintained with no patched release; only present under the optional bayesopt feature" },
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained with no patched release" },
]
